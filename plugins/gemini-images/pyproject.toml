[project]
name = "gemini-images"
version = "0.1.1"
license = "0BSD"
license-files = ["LICENSE"]
description = "MCP server for Gemini image generation"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.0",
    "mcp>=1.0.0,<2.0.0",
    "Pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit the real Gemini API (deselect with -m 'not integration')",
]

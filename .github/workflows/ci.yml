name: Validate plugins and importer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.5.10"
      - name: Verify development lock freshness
        run: |
          uv pip compile requirements-dev.txt --generate-hashes --no-header \
            --output-file /tmp/requirements-dev.lock
          cmp -s requirements-dev.lock /tmp/requirements-dev.lock || {
            echo "requirements-dev.lock is stale; regenerate it with uv 0.5.10."
            exit 1
          }
      - name: Install offline test dependencies
        run: python3.13 -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate locked Gemini runtime
        run: |
          uv lock --check --project plugins/gemini-images
          uv run --locked --no-dev --project plugins/gemini-images \
            python -c "import google.genai, mcp, PIL"
      - name: Validate manifests, imports, and offline plugin behavior
        run: |
          python3.13 scripts/skills.py validate
          python3.13 -m unittest discover -s tests -v
          python3.13 -m pytest plugins/gemini-images/tests/test_helpers.py -q
          python3.13 scripts/demo-import.py

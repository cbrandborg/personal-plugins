name: Validate plugins and importer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.15"
      - name: Verify development lock freshness
        run: |
          uv pip compile requirements-dev.txt --generate-hashes --no-header \
            --output-file /tmp/requirements-dev.lock
          cmp -s requirements-dev.lock /tmp/requirements-dev.lock || {
            echo "requirements-dev.lock is stale; regenerate it with uv 0.12.15."
            exit 1
          }
      - name: Install offline test dependencies
        run: python3.13 -m pip install --require-hashes -r requirements-dev.lock
      - name: Install pinned Hermes plugin validator
        run: |
          git init /tmp/hermes-agent
          git -C /tmp/hermes-agent remote add origin https://github.com/NousResearch/hermes-agent.git
          git -C /tmp/hermes-agent fetch --depth 1 origin 939e45c91d751fadd94dcd1b873ac3cb44846213
          git -C /tmp/hermes-agent checkout --detach FETCH_HEAD
          uv sync --locked --project /tmp/hermes-agent --no-dev
          echo "/tmp/hermes-agent/.venv/bin" >> "$GITHUB_PATH"
      - name: Validate locked Gemini runtime
        run: |
          uv lock --check --project plugins/gemini-images
          uv run --locked --no-dev --project plugins/gemini-images \
            python -c "import google.genai, mcp, PIL"
      - name: Validate manifests, imports, and offline plugin behavior
        run: |
          for plugin in plugins/*; do
            if [[ -f "$plugin/plugin.json" || -f "$plugin/plugin.yaml" ]]; then
              hermes plugins doctor "$plugin" --ci
            fi
          done
          python3.13 scripts/skills.py validate
          python3.13 -m unittest discover -s tests -v
          python3.13 -m unittest discover -s plugins/dm-kit/tests -v
          uv run --locked --project plugins/gemini-images \
            pytest plugins/gemini-images/tests -m 'not integration' -q
          python3.13 scripts/demo-import.py

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  codeql:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: python
          build-mode: none
      - name: Analyze Python
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3

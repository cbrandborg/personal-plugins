name: Validate marketplace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate dual marketplaces, portable skills, and sync behavior
        run: |
          python3.13 scripts/skills.py validate
          python3.13 -m unittest discover -s tests -v

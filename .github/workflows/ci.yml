name: Validate plugins and importer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install offline test dependencies
        run: python3.13 -m pip install -r requirements-dev.txt
      - name: Validate manifests, imports, and offline plugin behavior
        run: |
          python3.13 scripts/skills.py validate
          python3.13 -m unittest discover -s tests -v
          python3.13 -m pytest plugins/gemini-images/tests/test_helpers.py -q
          python3.13 scripts/demo-import.py
